[platformio]
src_dir = .

[env:disco_l4s5i_iot01a]
platform = ststm32
board = disco_l4s5i_iot01a
build_type = debug

board_build.ldscript = STM32L4S5VITX_FLASH.ld

upload_protocol = stlink
debug_tool = stlink
debug_init_break = tbreak main

monitor_speed = 115200

build_flags =
    -DSTM32L4S5xx
    -DUSE_HAL_DRIVER

    -ICore/Inc

    -IDrivers/STM32L4xx_HAL_Driver/Inc
    -IDrivers/STM32L4xx_HAL_Driver/Inc/Legacy
    -IDrivers/CMSIS/Device/ST/STM32L4xx/Include
    -IDrivers/CMSIS/Include
    -IDrivers/BSP/B-L4S5I-IOT01
    -IDrivers/BSP/Components

    -Ilib/tflm
    -Ilib/tflm/third_party/flatbuffers/include
    -Ilib/tflm/third_party/kissfft
    -Ilib/tflm/third_party/gemmlowp
    -Ilib/tflm/third_party/ruy

    -std=gnu++17



build_src_filter =
    +<Core/Src/*.c>
    +<Core/Src/*.cpp>
    +<Core/Startup/*.s>

    +<Drivers/STM32L4xx_HAL_Driver/Src/*.c>
    -<Drivers/STM32L4xx_HAL_Driver/Src/*_template.c>

    +<Drivers/BSP/B-L4S5I-IOT01/*.c>
    +<Drivers/BSP/Components/**/*.c>
